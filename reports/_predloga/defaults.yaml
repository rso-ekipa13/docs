# pandoc --defaults ../_predloga/defaults.yaml  (zaženi iz mape poročila)
from: markdown+raw_tex+pipe_tables+yaml_metadata_block+implicit_figures+link_attributes+footnotes
pdf-engine: lualatex
include-in-header:
  - ../_predloga/header.tex
variables:
  documentclass: article
  papersize: a4
  fontsize: 10pt
  geometry:
    - top=2.2cm
    - bottom=2.2cm
    - left=2.1cm
    - right=2.1cm
  mainfont: Inter
  monofont: Liberation Mono
  colorlinks: true
  linkcolor: blue
  urlcolor: blue
  numbersections: true
